nt-weight="800" text-anchor="middle" >block</text><text x="90" y="620" font-size="22" fill="#f2b632" font-weight="800" text-anchor="start" >Pt weld, then</text><text x="90" y="648" font-size="22" fill="#f2b632" font-weight="800" text-anchor="start" >cut the probe free</text><line x1="200" y1="600" x2="425" y2="495" stroke="#f2b632" stroke-width="2.5" marker-end="url(#ahw)"/><rect x="100" y="199" width="356.64000000000004" height="36" rx="9" fill="#2a3a5c"/><text x="112" y="225" font-size="22" fill="#e8edf7" font-weight="800" text-anchor="start" >Pin axis along the ion beam</text></g><g><rect x="1215.0" y="520" width="70" height="270" fill="url(#pinv)" stroke="#5c6678" stroke-width="2"/><rect x="1160" y="440" width="180" height="82" fill="url(#blk)" stroke="#4b6d95" stroke-width="2"/><polygon points="1010,330 1110,375 1140,440 1120,466 1000,410" fill="url(#probeg)" stroke="#6b7586" stroke-width="2"/><ellipse cx="1150" cy="500" rx="14" ry="22" fill="#f2b632"/><line x1="1420" y1="205" x2="1420" y2="420" stroke="#38e8ff" stroke-width="5" marker-end="url(#ah)"/><text x="1434" y="223" font-size="22" fill="#38e8ff" font-weight="800" text-anchor="start" >Ion beam</text><line x1="1124" y1="205" x2="1416" y2="416" stroke="#ffb454" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#ahe)"/><text x="1124.0778870986978" y="193.00000000000009" font-size="22" fill="#ffb454" font-weight="800" text-anchor="start" >Electron beam</text><text x="1250" y="495" font-size="22" fill="#0a1a2e" font-weight="800" text-anchor="middle" >block</text><text x="1345" y="660" font-size="24" fill="#e8edf7" font-weight="700" text-anchor="start" >pin</text><line x1="1340" y1="650" x2="1290" y2="640" stroke="#e8edf7" stroke-width="2.5" marker-end="url(#ahw)"/><text x="1000" y="300" font-size="22" fill="#d5dbe5" font-weight="700" text-anchor="start" >probe</text></g><text x="40" y="884" font-size="17" fill="#5f6c85" font-weight="500" text-anchor="start" >Schematic, not to scale. Draft figure: check