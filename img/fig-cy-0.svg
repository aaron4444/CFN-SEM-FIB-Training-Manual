<linearGradient id="pinv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d8798"/><stop offset=".45" stop-color="#e3e8f0"/><stop offset="1" stop-color="#7d8798"/></linearGradient><linearGradient id="blk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9cc8ef"/><stop offset="1" stop-color="#6aa0d3"/></linearGradient></defs><rect width="1600" height="900" fill="#0e1524"/><text x="60" y="80" font-size="44" fill="#e8edf7" font-weight="800" text-anchor="start" >Cylinder liftout at a glance</text><text x="60" y="118" font-size="24" fill="#9aa7bf" font-weight="500" text-anchor="start" >Take a block from the sample, put it on a pin, and mill it into a 2–10 µm cylinder for tomography.</text><rect x="35" y="170" width="285" height="360" rx="14" fill="#162036"/><circle cx="70" cy="208" r="22" fill="#f2b632"/><text x="70" y="217" font-size="26" fill="#1a1300" font-weight="800" text-anchor="middle" >1</text><text x="104" y="218" font-size="28" fill="#e8edf7" font-weight="800" text-anchor="start" >Extract</text><rect x="50" y="240" width="250" height="190" rx="10" fill="url(#grain)"/><rect x="95" y="270" width="160" height="130" fill="url(#tr1)"/><rect x="135" y="300" width="80" height="70" fill="url(#blk)" stroke="#f2b632" stroke-width="3"/><polygon points="54,264 134,331 136,329 62,256" fill="url(#probeg)" stroke="#6b7586" stroke-width="2"/><text x="50" y="465" font-size="22" fill="#9aa7bf" font-weight="600" text-anchor="start" >cut out a block</text><rect x="330" y="170" width="285" height="360" rx="14" fill="#162036"/><circle cx="365" cy="208" r="22" fill="#f2b632"/><text x="365" y="217" font-size="26" fill="#1a1300" font-weight="800" text-anchor="middle" >2</text><text x="399" y="218" font-size="28" fill="#e8edf7" font-weight="800" text-anchor="start" >Mount</text><rect x="345" y="240" width="250" height="190" rx="10" fill="#0b111e"/><rect x="445.0" y="340" width="50" height="90" fill="url(#pinv)" stroke="#5c6678" stroke-width="2"/><rect x="425" y="300" width="90" height="42" fill="url(#blk)"/><polygon points="352,275 424,321 426,319 358,265" fill="url(#probeg)" stroke="#6b7586" stroke-width="2"/><ellipse cx="428" cy="322" rx="6" ry="10" fill="#f2b632"/><text x="345" y="465" font-size="22" fill="#9aa7bf" font-weight="600" text-anchor="start" >weld to the pin</text><rect x="625" y="170" width="285" height="360" rx="14" fill="#162036"/><circle cx="660" cy="208" r="22" fill="#f2b632"/><text x="660" y="217" font-size="26" fill="#1a1300" font-weight="800" text-anchor="middle" >3</text><text x="694" y="218" font-size="28" fill="#e8edf7" font-weight="800" text-anchor="start" >Annular mill</text><rect x="640" y="240" width="250" height="190" rx="10" fill="#0b111e"/><rect x="695" y="265" width="140" height="140" fill="url(#blk)"/><circle cx="765" cy="335" r="60" fill="none" stroke="#05070c" stroke-width="22"/><circle cx="765" cy="335" r="46" fill="#9cc8ef" stroke="#f2b632" stroke-width="2" stroke-dasharray="6 4"/><text x="640" y="465" font-size="22" fill="#9aa7bf" font-weight="600" text-anchor="start" >donut, large to small</text><rect x="920" y="170" width="285" height="360" rx="14" fill="#162036"/><circle cx="955" cy="208" r="22" fill="#f2b632"/><text x="955" y="217" font-size="26" fill="#1a1300" font-weight="800" text-anchor="middle" >4</text><text x="989" y="218" font-size="28" fill="#e8edf7" font-weight="800" text-anchor="start" >Fine mill</text><rect x="935" y="240" width="250" height="190" rx="10" fill="#0b111e"/><circle cx="1060" cy="335" r="62" fill="url(#pinv)"/><circle cx="1060" cy="335" r="34" fill="url(#blk)" stroke="#f2b632" stroke-width="2"/><text x="935" y="465" font-size="22" fill="#9aa7bf" font-weight="600" text-anchor="start" >target Ø, clean-up</text><rect x="1215" y="170" width="285" height="360" rx="14" fill="#162036"/><circle cx="1250" cy="208" r="22" fill="#f2b632"/><text x="1250" y="217" font-size="26" fill="#1a1300" font-weight="800" text-anchor="middle" >5</text><text x="1284" y="218" font-size="28" fill="#e8edf7" font-weight="800" text-anchor="start" >Tomography</text><rect x="1230" y="240" width="250" height="190" rx="10" fill="#0b111e"/><g opacity="0.4" transform="rotate(-70 1355 325)"><rect x="1345.0" y="325" width="20" height="90" fill="url(#pinv)" stroke="#5c6678" stroke-width="2"/><polygon points="1349.0,285 1361.0,285 1362.0,325 1348.0,325" fill="url(#blk)" stroke="#4b6d95" stroke-width="2"/></g><g opacity="0.4" transform="rotate(70 1355 325)"><rect x="1345.0" y="325" width="20" height="90" fill="url(#pinv)" stroke="#5c6678" stroke-width="2"/><polygon points="1349.0,285 1361.0,285 1362.0,325 1348.0,325" fill="url(#blk)" stroke="#4b6d95" stroke-width="2"/></g><g opacity="1" transform="rotate(0 1355 325)"><rect x="1345.0" y="325" width="20" height="90" fill="url(#pinv)" stroke="#5c6678" stroke-width="2"/><polygon points="1349.0,285 1361.0,285 1362.0,325 1348.0,325" fill="url(#blk)" stroke="#4b6d95" stroke-width="2"/></g><text x="1230" y="465" font-size="22" fill="#9aa7bf" font-weight="600" text-anchor="start" >check over the tilt range</text><rect x="40" y="580" width="1520" height="270" rx="14" fill="#162036"/><text x="70" y="625" font-size="26" fill="#e8edf7" font-weight="800" text-anchor="start" >Typical diameters</text><circle cx="160" cy="740" r="13.0" fill="url(#blk)" stroke="#4b6d95" stroke-width="2"/><text x="160" y="787.0" font-size="24" fill="#e8edf7" font-weight="800" text-anchor="middle" >2 µm</text><circle cx="250" cy="740" r="32.5" fill="url(#blk)" stroke="#4b6d95" stroke-width="2"/><text x="250" y="806.5" font-size="24" fill="#e8edf7" font-weight="800" text-anchor="middle" >5 µm</text><circle cx="380" cy="740" r="65.0" fill="url(#blk)" stroke="#4b6d95" stroke-width="2"/><text x="380" y="839.0" font-size="24" fill="#e8edf7" font-weight="800" text-anchor="middle" >10 µm</text><text x="560" y="680" font-size="24" fill="#e8edf7" font-weight="700" text-anchor="start" >Pin axis along the ion beam while you mill the donuts.</text><text x="560" y="720" font-size="24" fill="#e8edf7" font-weight="700" text-anchor="start" >Shrink the diameter and current in stages.</text><text x="560" y="760" font-size="24" fill="#e8edf7" font-weight="700" text-anchor="start" >Finish with a low-kV clean-up.</text><text x="560" y="810" font-size="19" fill="#9aa7bf" font-weight="500" text-anchor="start" >Circles drawn to scale (26 px per 1 µm of diameter).</text></svg>