ll="#e8edf7"/><text x="160.0" y="772" font-size="20" fill="#e8edf7" font-weight="700" text-anchor="middle" >5 µm</text><rect x="100" y="199" width="381.28000000000003" height="36" rx="9" fill="#2a3a5c"/><text x="112" y="225" font-size="22" fill="#e8edf7" font-weight="800" text-anchor="start" >Stage tilted for the undercut</text></g><g><polygon points="990,430 1150,430 1150,720 1370,720 1370,430 1510,430 1510,780 990,780" fill="url(#grain)" stroke="#1f2a40" stroke-width="2"/><polygon points="1215,430 1305,430 1305,570 1250,640 1215,640" fill="#7fb4e6"/><rect x="1215" y="414" width="90" height="16" fill="#f2b632"/><polygon points="1215,640 1250,640 1305,570 1305,720 1215,720" fill="#05070c"/><line x1="1260" y1="205" x2="1260" y2="400" stroke="#38e8ff" stroke-width="5" marker-end="url(#ah)"/><text x="1274" y="223" font-size="22" fill="#38e8ff" font-weight="800" text-anchor="start" >Ion beam</text><line x1="992" y1="205" x2="1256" y2="396" stroke="#ffb454" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#ahe)"/><text x="991.6055255081212" y="193.00000000000003" font-size="22" fill="#ffb454" font-weight="800" text-anchor="start" >Electron beam</text><text x="1000" y="765" font-size="22" fill="#e8edf7" font-weight="700" text-anchor="start" >undercut frees the bottom</text><line x1="1215" y1="748" x2="1240" y2="712" stroke="#e8edf7" stroke-width="2.5" marker-end="url(#ahw)"/></g><text x="40" y="884" font-size="17" fill="#5f6c85" font-weight="500" text-anchor="start" >Schematic, not to scale. Draft figure: check dimensions against your recipe.</text></svg>