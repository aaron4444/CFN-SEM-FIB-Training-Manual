<marker id="ahw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8edf7"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3d71"/></marker>
<linearGradient id="pinv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d8798"/><stop offset=".45" stop-color="#e3e8f0"/><stop offset="1" stop-color="#7d8798"/></linearGradient><linearGradient id="blk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9cc8ef"/><stop offset="1" stop-color="#6aa0d3"/></linearGradient></defs><rect width="1600" height="900" fill="#0e1524"/><circle cx="62" cy="52" r="30" fill="#f2b632"/><text x="62" y="63" font-size="34" fill="#1a1300" font-weight="800" text-anchor="middle" >4</text><text x="110" y="50" font-size="38" fill="#e8edf7" font-weight="800" text-anchor="start" >Fine milling and clean-up</text><text x="110" y="82" font-size="22" fill="#9aa7bf" font-weight="500" text-anchor="start" >Finish at the target diameter with low current; check for taper and clean up.</text><rect x="40" y="108" width="860" height="750" rx="16" fill="#162036"/><rect x="940" y="108" width="620" height="750" rx="16" fill="#162036"/><text x="60" y="142" font-size="21" fill="#9aa7bf" font-weight="700" text-anchor="start" >Side view of the cylinder</text><text x="960" y="142" font-size="21" fill="#9aa7bf" font-weight="700" text-anchor="start" >Size guide and checks</text><g><rect x="125" y="190" width="350" height="640" rx="10" fill="#0b111e"/><rect x="225.0" y="640" width="150" height="140" fill="url(#pinv)" stroke="#5c6678" stroke-width="2"/><polygon points="265.0,300 335.0,300 359.0,640 241.0,640" fill="url(#blk)" stroke="#4b6d95" stroke-width="2"/><text x="300" y="815" font-size="22" fill="#9aa7bf" font-weight="800" text-anchor="middle" >coarse pass only</text><line x1="205" y1="300" x2="395" y2="300" stroke="#38e8ff" stroke-width="0"/><line x1="300" y1="205" x2="300" y2="285" stroke="#38e8ff" stroke-width="4" marker-end="url(#ah)"/><rect x="475" y="190" width="350" height="640" rx="10" fill="#0b111e"/><rect x="575.0" y="640" width="150" height="140" fill="url(#pinv)" stroke="#5c6678" stroke-width="2"/><polygon points="613.0,300 687.0,300 690.0,640 610.0,640" fill="url(#blk)" stroke="#4b6d95" stroke-width="2"/><text x="650" y="815" font-size="22" fill="#e8edf7" font-weight="800" text-anchor="middle" >after fine / low-kV pass</text><line x1="555" y1="300" x2="745" y2="300" stroke="#38e8ff" stroke-width="0"/><line x1="650" y1="205" x2="650" y2="285" stroke="#38e8ff" stroke-width="4" marker-end="url(#ah)"/><text x="372" y="450" font-size="20" fill="#ff3d71" font-weight="700" text-anchor="start" >wider at</text><text x="372" y="476" font-size="20" fill="#ff3d71" font-weight="700" text-anchor="start" >the base</text><text x="372" y="502" font-size="20" fill="#ff3d71" font-weight="700" text-anchor="start" >(taper)</text><text x="704" y="450" font-size="20" fill="#5be38a" font-weight="700" text-anchor="start" >near-</text><text x="704" y="476" font-size="20" fill="#5be38a" font-weight="700" text-anchor="start" >parallel</text><text x="704" y="502" font-size="20" fill="#5be38a" font-weight="700" text-anchor="start" >sides</text><line x1="520" y1="690" x2="560" y2="690" stroke="#e8edf7" stroke-width="0"/></g><g><rect x="990" y="175" width="540" height="320" rx="10" fill="#0b111e"/><text x="1010" y="215" font-size="24" fill="#e8edf7" font-weight="800" text-anchor="start" >Typical cylinder diameters</text><circle cx="1030" cy="360" r="20.0" fill="url(#blk)" stroke="#4b6d95" stroke-width="2"/><text x="1030" y="414.0" font-size="24" fill="#e8edf7" font-weight="800" text-anchor="middle" >2 µm</text><circle cx="1140" cy="360" r="50.0" fill="url(#blk)" stroke="#4b6d95" stroke-width="2"/><text x="1140" y="444.0" font-size="24" fill="#e8edf7" font-weight="800" text-anchor="middle" >5 µm</text><circle cx="1330" cy="360" r="100.0" fill="url(#blk)" stroke="#4b6d95" stroke-width="2"/><text x="1330" y="494.0" font-size="24" fill="#e8edf7" font-weight="800" text-anchor="middle" >10 µm</text><text x="1010" y="478" font-size="17" fill="#9aa7bf" font-weight="500" text-anchor="start" >to scale</text><text x="960" y="540" font-size="24" fill="#e8edf7" font-weight="800" text-anchor="start" >Final pass tips</text><circle cx="975" cy="583" r="6" fill="#f2b632"/><text x="992" y="590" font-size="21" fill="#e8edf7" font-weight="500" text-anchor="start" >Finish at low current for a clean surface</text><circle cx="975" cy="633" r="6" fill="#f2b632"/><text x="992" y="640" font-size="21" fill="#e8edf7" font-weight="500" text-anchor="start" >Look from two angles (rotate ~90°) to check for taper</text><circle cx="975" cy="683" r="6" fill="#f2b632"/><text x="992" y="690" font-size="21" fill="#e8edf7" font-weight="500" text-anchor="start" >Finish with a low-kV clean-up to reduce damage</text><circle cx="975" cy="733" r="6" fill="#f2b632"/><text x="992" y="740" font-size="21" fill="#e8edf7" font-weight="500" text-anchor="start" >Use a tiny stage tilt in the last pass if the sides taper</text></g><text x="40" y="884" font-size="17" fill="#5f6c85" font-weight="500" text-anchor="start" >Schematic, not to scale. Draft figure: check dimensions against your recipe.</text></svg>