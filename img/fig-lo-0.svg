</defs><rect width="1600" height="900" fill="#0e1524"/><text x="60" y="80" font-size="44" fill="#e8edf7" font-weight="800" text-anchor="start" >Liftout at a glance</text><text x="60" y="118" font-size="24" fill="#9aa7bf" font-weight="500" text-anchor="start" >Seven stages from protecting the site to a thin lamella on a grid.</text><rect x="37" y="200" width="209" height="360" rx="14" fill="#162036"/><circle cx="69" cy="240" r="22" fill="#f2b632"/><text x="69" y="249" font-size="26" fill="#1a1300" font-weight="800" text-anchor="middle" >1</text><text x="103" y="250" font-size="28" fill="#e8edf7" font-weight="800" text-anchor="start" >Protect</text><rect x="48" y="280" width="190" height="130" rx="10" fill="url(#grain)"/><rect x="73" y="332" width="140" height="22" fill="#f2b632"/><text x="48" y="465" font-size="21" fill="#9aa7bf" font-weight="600" text-anchor="start" >Pt strip over ROI</text><rect x="250" y="200" width="209" height="360" rx="14" fill="#162036"/><circle cx="282" cy="240" r="22" fill="#f2b632"/><text x="282" y="249" font-size="26" fill="#1a1300" font-weight="800" text-anchor="middle" >2</text><text x="316" y="250" font-size="28" fill="#e8edf7" font-weight="800" text-anchor="start" >Trenches</text><rect x="261" y="280" width="190" height="130" rx="10" fill="url(#grain)"/><rect x="276" y="298" width="160" height="38" fill="url(#tr1)"/><rect x="276" y="356" width="160" height="38" fill="url(#tr2)"/><rect x="286" y="336" width="140" height="20" fill="#7fb4e6"/><text x="261" y="465" font-size="21" fill="#9aa7bf" font-weight="600" text-anchor="start" >mill both sides</text><rect x="463" y="200" width="209" height="360" rx="14" fill="#162036"/><circle cx="495" cy="240" r="22" fill="#f2b632"/><text x="495" y="249" font-size="26" fill="#1a1300" font-weight="800" text-anchor="middle" >3</text><text x="529" y="250" font-size="28" fill="#e8edf7" font-weight="800" text-anchor="start" >Free it</text><rect x="474" y="280" width="190" height="130" rx="10" fill="url(#grain)"/><rect x="489" y="298" width="160" height="38" fill="url(#tr1)"/><rect x="489" y="356" width="160" height="38" fill="url(#tr2)"/><rect x="508" y="336" width="130" height="20" fill="#7fb4e6"/><rect x="489" y="334" width="18" height="24" fill="#05070c"/><text x="474" y="465" font-size="21" fill="#9aa7bf" font-weight="600" text-anchor="start" >U-cut / J-cut</text><rect x="676" y="200" width="209" height="360" rx="14" fill="#162036"/><circle cx="708" cy="240" r="22" fill="#f2b632"/><text x="708" y="249" font-size="26" fill="#1a1300" font-weight="800" text-anchor="middle" >4</text><text x="742" y="250" font-size="28" fill="#e8edf7" font-weight="800" text-anchor="start" >Attach</text><rect x="687" y="280" width="190" height="130" rx="10" fill="url(#grain)"/><rect x="702" y="298" width="160" height="38" fill="url(#tr1)"/><rect x="702" y="356" width="160" height="38" fill="url(#tr2)"/><rect x="721" y="336" width="130" height="20" fill="#7fb4e6"/><polygon points="685,293 720,343 722,341 693,287" fill="url(#probeg)" stroke="#6b7586" stroke-width="2"/><rect x="717" y="338" width="12" height="14" fill="#f2b632"/><text x="687" y="465" font-size="21" fill="#9aa7bf" font-weight="600" text-anchor="start" >probe + Pt weld</text><rect x="889" y="200" width="209" height="360" rx="14" fill="#162036"/><circle cx="921" cy="240" r="22" fill="#f2b632"/><text x="921" y="249" font-size="26" fill="#1a1300" font-weight="800" text-anchor="middle" >5</text><text x="955" y="250" font-size="28" fill="#e8edf7" font-weight="800" text-anchor="start" >Lift out</text><rect x="900" y="280" width="190" height="130" rx="10" fill="url(#grain)"/><rect x="915" y="298" width="160" height="96" fill="#05070c"/><rect x="960" y="302" width="110" height="18" fill="#7fb4e6"/><polygon points="900,293 959,311 961,309 904,283" fill="url(#probeg)" stroke="#6b7586" stroke-width="2"/><text x="900" y="465" font-size="21" fill="#9aa7bf" font-weight="600" text-anchor="start" >cut free, retract</text><rect x="1102" y=