ext-anchor="middle" >block</text><text x="460" y="530" font-size="20" fill="#0a1a2e" font-weight="700" text-anchor="middle" >Pt-capped</text><text x="100" y="270" font-size="24" fill="#d5dbe5" font-weight="700" text-anchor="start" >OmniProbe</text><text x="700" y="500" font-size="21" fill="#f2b632" font-weight="800" text-anchor="start" >still attached</text><line x1="690" y1="490" x2="625" y2="490" stroke="#f2b632" stroke-width="2.5" marker-end="url(#ahw)"/><text x="100" y="740" font-size="22" fill="#e8edf7" font-weight="600" text-anchor="start" >block a bit wider than the cylinder you want</text><rect x="100" y="199" width="418.24" height="36" rx="9" fill="#2a3a5c"/><text x="112" y="225" font-size="22" fill="#e8edf7" font-weight="800" text-anchor="start" >Pt cap, trench, J-cut, then weld</text><rect x="700" y="790" width="100" height="7" fill="#e8edf7"/><text x="750.0" y="782" font-size="20" fill="#e8edf7" font-weight="700" text-anchor="middle" >5 µm</text></g><g><polygon points="990,430 1090,430 1090,720 1430,720 1430,430 1510,430 1510,780 990,780" fill="url(#grain)" stroke="#1f2a40" stroke-width="2"/><polygon points="1130,430 1390,430 1390,560 1330,640 1130,640" fill="url(#blk)"/><rect x="1130" y="414" width="260" height="16" fill="#f2b632"/><polygon points="1130,640 1330,640 1390,560 1390,720 1130,720" fill="#05070c"/><polygon points="1010,330 1100,356 1135,410 1115,440 1000,380" fill="url(#probeg)" stroke="#6b7586" stroke-width="2"/><ellipse cx="1135" cy="432" rx="16" ry="13" fill="#f2b632"/><line x1="1300" y1="205" x2="1300" y2="405" stroke="#38e8ff" stroke-width="5" marker-end="url(#ah)"/><text x="1314" y="223" font-size="22" fill="#38e8ff" font-weight="800" text-anchor="start" >Ion beam</text><line x1="1025" y1="205" x2="1296" y2="401" stroke="#ffb454" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#ahe)"/><text x="1024.7236159057652" y="192.99999999999991" font-size="22" fill="#ffb454" font-weight="800" text-anchor="start" >Electron beam</text><text x="1260" y="545" font-size="24" fill="#0a1a2e" font-weight="800" text-anchor="middle" >block</text><text x="1000" y="765" font-size="22" fill="#e8edf7" font-weight="700" text-anchor="start" >undercut frees the block</text></g><text x="40" y="884" font-size="17" fill="#5f6c85" font-weight="500" text-anchor="start" >Schematic, not to scale. Draft figure: check dimensions against your recipe.</text></svg>