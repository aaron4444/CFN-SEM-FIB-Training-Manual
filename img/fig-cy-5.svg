oke-width="2"/></g><text x="205" y="560" font-size="26" fill="#e8edf7" font-weight="800" text-anchor="middle" >-70°</text><text x="735" y="560" font-size="26" fill="#e8edf7" font-weight="800" text-anchor="middle" >+70°</text><text x="470" y="775" font-size="26" fill="#e8edf7" font-weight="800" text-anchor="middle" >0°</text><line x1="470" y1="190" x2="470" y2="300" stroke="#ffb454" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#ahe)"/><text x="490" y="215" font-size="22" fill="#ffb454" font-weight="800" text-anchor="start" >beam</text><text x="60" y="0" font-size="1" fill="#e8edf7" font-weight="600" text-anchor="start" ></text></g><g><rect x="965" y="185" width="570" height="100" rx="12" fill="#0b111e"/><circle cx="1003" cy="235" r="16" fill="#f2b632"/><text x="1003" y="244" font-size="1" fill="#e8edf7" font-weight="600" text-anchor="start" ></text><text x="1003" y="243" font-size="22" fill="#1a1300" font-weight="800" text-anchor="middle" >✓</text><text x="1035" y="230" font-size="22" fill="#e8edf7" font-weight="700" text-anchor="start" >Cylinder is straight and</text><text x="1035" y="262" font-size="21" fill="#9aa7bf" font-weight="500" text-anchor="start" >centred on the pin axis</text><rect x="965" y="303" width="570" height="100" rx="12" fill="#0b111e"/><circle cx="1003" cy="353" r="16" fill="#f2b632"/><text x="1003" y="362" font-size="1" fill="#e8edf7" font-weight="600" text-anchor="start" ></text><text x="1003" y="361" font-size="22" fill="#1a1300" font-weight="800" text-anchor="middle" >✓</text><text x="1035" y="348" font-size="22" fill="#e8edf7" font-weight="700" text-anchor="start" >The post, clip and</text><text x="1035" y="380" font-size="21" fill="#9aa7bf" font-weight="500" text-anchor="start" >holder never block the beam at high tilt</text><rect x="965" y="421" width="570" height="100" rx="12" fill="#0b111e"/><circle cx="1003" cy="471" r="16" fill="#f2b632"/><text x="1003" y="480" font-size="1" fill="#e8edf7" font-weight="600" text-anchor="start" ></text><text x="1003" y="479" font-size="22" fill="#1a1300" font-weight="800" text-anchor="middle" >✓</text><text x="1035" y="466" font-size="22" fill="#e8edf7" font-weight="700" text-anchor="start" >Diameter fits inside the</text><text x="1035" y="498" font-size="21" fill="#9aa7bf" font-weight="500" text-anchor="start" >field of view over the whole tilt range</text><rect x="965" y="539" width="570" height="100" rx="12" fill="#0b111e"/><circle cx="1003" cy="589" r="16" fill="#f2b632"/><text x="1003" y="598" font-size="1" fill="#e8edf7" font-weight="600" text-anchor="start" ></text><text x="1003" y="597" font-size="22" fill="#1a1300" font-weight="800" text-anchor="middle" >✓</text><text x="1035" y="584" font-size="22" fill="#e8edf7" font-weight="700" text-anchor="start" >Rotate the pin to</text><text x="1035" y="616" font-size="21" fill="#9aa7bf" font-weight="500" text-anchor="start" >check from a second direction before you leave</text><rect x="965" y="657" width="570" height="100" rx="12" fill="#0b111e"/><circle cx="1003" cy="707" r="16" fill="#f2b632"/><text x="1003" y="716" font-size="1" fill="#e8edf7" font-weight="600" text-anchor="start" ></text><text x="1003" y="715" font-size="22" fill="#1a1300" font-weight="800" text-anchor="middle" >✓</text><text x="1035" y="702" font-size="22" fill="#e8edf7" font-weight="700" text-anchor="start" >Note the diameter and</text><text x="1035" y="734" font-size="21" fill="#9aa7bf" font-weight="500" text-anchor="start" >height for the reconstruction (tomo_TV)</text></g><text x="40" y="884" font-size="17" fill="#5f6c85" font-weight="500" text-anchor="start" >Schematic, not to scale. Draft figure: check dimensions against your recipe.</text></svg>