<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<title>Crossbeam Quick Guide</title>
<style>
:root{
  --bg:#0b1220; --panel:#111a2c; --panel2:#16213a; --line:#243450; --text:#e8eef9; --muted:#97a8c4;
  --accent:#38d6c4; --accent-ink:#04201c; --hi:#ff3d71; --hi-glow:rgba(255,61,113,.55);
  --warn:#ffb020; --warn-bg:rgba(255,176,32,.12); --ok:#4ade80; --chip:#1d2b47; --shadow:0 8px 28px rgba(0,0,0,.4);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#f2f5fa; --panel:#ffffff; --panel2:#eaeff8; --line:#d3dbea; --text:#14203a; --muted:#566785;
  --accent:#0a8f82; --accent-ink:#ffffff; --warn:#a85a00; --warn-bg:rgba(255,176,32,.18); --chip:#e3eaf7; --shadow:0 8px 28px rgba(20,32,58,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
kbd{font:600 .86em var(--mono);background:var(--chip);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:.05em .45em;white-space:nowrap}
b{font-weight:700}

/* header */
#hdr{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px)}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-size:1.05rem;letter-spacing:.01em;white-space:nowrap}
.brand span{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;flex:1;max-width:620px;margin-left:auto}
.search input{width:100%;padding:.62rem 2.6rem .62rem 2.4rem;border-radius:12px;border:1px solid var(--line);background:var(--panel);outline:none;font-size:1rem}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
.search .ic{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search kbd{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:.45rem .8rem;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.btn.danger{border-color:#7a2a3d;color:#ff8aa6}
.btn.sm{padding:.25rem .55rem;font-size:.85rem;border-radius:8px}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.icon{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:38px;height:38px;display:none}
.chip{font-size:.8rem;padding:.2rem .6rem;border-radius:99px;background:var(--chip);border:1px solid var(--line);white-space:nowrap}
.chip.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.chip.ok{border-color:var(--ok);color:var(--ok)}

/* quick bar */
.quick{display:flex;gap:8px;overflow-x:auto;padding:10px 18px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.quick button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:.4rem .95rem;font-weight:600;font-size:.92rem}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
.quick button.cur{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.authbar{display:none;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 18px;background:var(--warn-bg);border-bottom:1px solid var(--warn);font-size:.9rem}
body.author .authbar{display:flex}

/* layout */
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);align-items:start}
aside{position:sticky;top:var(--hdr,112px);max-height:calc(100vh - var(--hdr,112px));overflow:auto;padding:14px 12px 40px 18px;border-right:1px solid var(--line)}
.layout{grid-template-columns:270px minmax(0,1fr) var(--fw,370px)}
body.no-finder .layout{grid-template-columns:270px minmax(0,1fr)}
body.no-finder #finder{display:none}
#finder{border-right:0;border-left:1px solid var(--line);padding:14px 16px 40px 14px;background:color-mix(in srgb,var(--panel) 55%,transparent)}
#finder .fh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
#finder .fh b{font-size:1.05rem}
#finder .fh .x{margin-left:auto;display:none}
#finder .inp{width:100%;margin-bottom:6px}
.fgrp{margin:14px 0 4px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.fitem{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:.38rem .6rem;color:var(--text);font-size:.93rem;line-height:1.3}
.fitem:hover{background:var(--panel2)}
.fitem.open{background:var(--panel2);box-shadow:inset 3px 0 0 var(--hi);font-weight:700}
.fcard{margin:4px 0 10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.fcard .where{margin-top:0;margin-bottom:8px}
.fcard .note,.fcard .warn{font-size:.88rem}
.fcard .mv{margin-bottom:8px}
.fcard .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
@media (max-width:1280px){
  .layout,body.no-finder .layout{grid-template-columns:270px minmax(0,1fr)}
  #fgrip{display:none}
  body.no-finder #finder{display:block}
  #finder{position:fixed;right:0;top:0;bottom:0;z-index:60;width:min(92vw,420px);max-height:none;background:var(--panel);transform:translateX(102%);transition:transform .2s;padding-top:70px;border-left:1px solid var(--line)}
  body.finder-open #finder{transform:none;box-shadow:var(--shadow)}
  #finder .fh .x{display:inline-block}
}
.grp{margin:22px 0 8px;padding-bottom:6px;font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text);font-weight:800;border-bottom:2px solid var(--accent)}
.grp:first-child{margin-top:4px}
.nav{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:.42rem .6rem;color:var(--text)}
.nav:hover{background:var(--panel2)}
.nav.cur{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent);font-weight:700}
.nav .t{flex:1;min-width:0}
.nav .n{font-size:.75rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
main{padding:22px clamp(14px,3vw,36px) 80px;min-width:0;max-width:1240px}
.chhead h1{margin:0 0 4px;font-size:1.7rem;line-height:1.2}
.chhead p{margin:0;color:var(--muted)}
.chhead .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.badge{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:.15rem .5rem;border-radius:6px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.steps{display:flex;flex-direction:column;gap:14px;margin-top:18px}

/* step card */
.step{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;scroll-margin-top:calc(var(--hdr,112px) + 12px)}
.step.has-media{grid-template-columns:minmax(0,1fr) minmax(0,var(--mc,48%))}
.step.has-media.stack{grid-template-columns:minmax(0,1fr)}
.step.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.step.done{opacity:.55}
.sh{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--chip);border:1px solid var(--line);font-weight:800;font-size:.9rem;cursor:pointer;user-select:none}
.num:hover{border-color:var(--accent)}
.step.done .num{background:var(--ok);color:#052e16;border-color:transparent}
.stext{font-size:1.1rem;line-height:1.5}
.where{display:inline-block;margin-top:8px;font-size:.84rem;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:7px;padding:.18rem .55rem}
.note,.warn,.hint{margin:10px 0 0;padding:.5rem .75rem;border-radius:10px;font-size:.93rem}
.note{background:var(--panel2);color:var(--muted)}
.warn{background:var(--warn-bg);border:1px solid var(--warn);color:var(--text)}
.warn::before{content:"⚠ ";color:var(--warn)}
.hint{border:1px dashed var(--accent);color:var(--accent);background:transparent}
.stbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.medias{display:flex;flex-direction:column;gap:12px;min-width:0}
.mwrap{position:relative;width:var(--mw,100%);max-width:100%}
.mtools{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.slot{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:.9rem}

/* media view */
.mv{position:relative;overflow:hidden;border-radius:12px;background:#000;container-type:inline-size;width:100%;border:1px solid var(--line);cursor:zoom-in}
.mv.editing{cursor:crosshair}
.mv-stage{position:absolute}
.dc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:18px;display:flex;flex-direction:column;gap:14px}
.dc h3{margin:0;font-size:1.05rem}
.dc .fld{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end}
.dc label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:700}
.dc .inp{font-size:1.1rem;padding:.4rem .6rem;width:120px}
.dc select.inp{width:auto}
.dc .inp.wide{width:100%;min-width:260px}
.dc .big{border-radius:14px;padding:14px 16px;border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.dc .big.bad{border-color:var(--warn);background:var(--warn-bg)}
.dc .big .v{font-size:2rem;font-weight:800;line-height:1.1}
.dc .big .s{color:var(--muted);margin-top:4px}
.dc table{border-collapse:collapse;width:100%;font-size:.95rem}
.dc th{text-align:left;font-size:.8rem;color:var(--muted);padding:4px 8px}
.dc td{padding:6px 8px;border-top:1px solid var(--line)}
.dc tr.rec td{background:color-mix(in srgb,var(--ok) 20%,transparent);font-weight:800}
.dc tr.over td{color:var(--muted)}
.dc tr.next td{color:var(--text)}
.dc .bar{height:8px;border-radius:4px;background:var(--chip);position:relative;min-width:80px;overflow:hidden}
.dc .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
.dc .bar i.o{background:var(--warn)}
.dc .tag{font-size:.72rem;font-weight:800;padding:.1rem .45rem;border-radius:6px;background:var(--chip)}
.dc tr.rec .tag{background:var(--ok);color:#052e16}
.mv-part{position:absolute;display:block;pointer-events:none}
.cambox{position:absolute;border:2px dashed #38e8ff;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none}
.szrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%}
.szrow input[type=range]{flex:1 1 120px;min-width:90px}
#fgrip{position:fixed;top:var(--hdr,112px);bottom:0;right:calc(var(--fw,370px) - 5px);width:10px;cursor:col-resize;z-index:30;touch-action:none}
body.no-finder #fgrip{display:none}
#fgrip:hover,#fgrip.on{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.mv-media{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.mv-ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mk{position:absolute;pointer-events:none}
.mk.box{border:3px solid var(--hi);border-radius:7px;box-shadow:0 0 0 2px rgba(255,255,255,.92),0 0 18px 3px var(--hi-glow);animation:pulse 1.7s ease-in-out infinite}
.mk.ring{width:clamp(30px,6cqw,66px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:4px solid var(--hi);box-shadow:0 0 0 2px #fff,0 0 18px 3px var(--hi-glow);animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.mk-l{position:absolute;left:-3px;bottom:calc(100% + 7px);background:var(--hi);color:#fff;font:700 clamp(10px,2.1cqw,16px)/1 var(--sans);padding:.38em .65em;border-radius:6px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.mk.ring .mk-l{left:50%;transform:translateX(-50%);bottom:calc(100% + 8px)}
.lbl-below>.mk-l{bottom:auto;top:calc(100% + 7px)}
.lbl-right>.mk-l{left:auto;right:-3px}
.lbl-in>.mk-l{bottom:auto;top:8px;left:8px}
.halo,.ripple{position:absolute;width:clamp(30px,7cqw,78px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;will-change:left,top}
.halo{border:4px solid var(--hi);background:rgba(255,61,113,.16);box-shadow:0 0 0 2px #fff,inset 0 0 0 2px #fff,0 0 20px 5px var(--hi-glow)}
.ripple{border:4px solid var(--hi);box-shadow:0 0 0 2px #fff}
.arrow{position:absolute;width:clamp(22px,4.4cqw,52px);pointer-events:none;opacity:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.mv-bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:4px;align-items:center;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,.7));opacity:0;transition:opacity .15s;pointer-events:auto}
.mv:hover .mv-bar,.mv-bar:focus-within{opacity:1}
.mv-bar button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:7px;padding:.2rem .55rem;font-size:.85rem;backdrop-filter:blur(4px)}
.mv-bar button:hover{background:rgba(255,255,255,.35)}
.mv-bar .sp{flex:1}
.mv-prog{position:absolute;left:0;bottom:0;height:3px;background:var(--hi);width:0;pointer-events:none}
.mv.broken::after{content:attr(data-err);position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px;color:#fff;background:#222;font-size:.9rem}

/* search results */
.results{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.res{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:14px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 14px;width:100%}
.res.nomedia{grid-template-columns:1fr}
.res:hover{border-color:var(--accent)}
.res .crumb{font-size:.78rem;color:var(--muted);margin-bottom:2px}
.res .rt{font-size:1.02rem}
.res .mv{cursor:pointer}

/* lightbox + modal */
.lb{position:fixed;inset:0;z-index:100;background:rgba(3,7,14,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}
.lb-top{display:flex;gap:8px;align-items:center;color:#fff}
.lb-holder{display:flex;justify-content:center}
.modal-bg{position:fixed;inset:0;z-index:90;background:rgba(3,7,14,.7);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(640px,100%);outline:none}
.modal.wide{width:min(1240px,100%)}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:1.1rem;flex:1}
.mb{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted)}
label.f input,label.f textarea,label.f select,.inp{padding:.5rem .65rem;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:.95rem}
label.f textarea{min-height:70px;resize:vertical}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.edcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.tbtn{display:flex;flex-wrap:wrap;gap:6px}
.list{border:1px solid var(--line);border-radius:10px;max-height:260px;overflow:auto;font-size:.85rem}
.list .r{display:grid;grid-template-columns:24px 1fr auto auto;gap:6px;align-items:center;padding:4px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.list .r.sel{background:var(--panel2)}
.list .r:last-child{border-bottom:0}
.list h4{margin:0;padding:6px 8px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--panel)}
.list input.inp{padding:.15rem .4rem;font-size:.82rem;width:100%}
.list input[type=number]{width:62px}
.small{font-size:.82rem;color:var(--muted)}
.ed-ov{position:absolute;inset:0;pointer-events:auto;touch-action:none}
.ed-ov svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.kf{position:absolute;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);background:var(--accent);color:var(--accent-ink);font:800 11px/20px var(--sans);text-align:center;border:2px solid #fff;cursor:grab;box-shadow:0 1px 5px rgba(0,0,0,.6)}
.kf.click{background:var(--hi);color:#fff}
.kf.sel{outline:3px solid #ffd60a}
.edbox{position:absolute;border:2px dashed #fff;background:rgba(255,255,255,.12);pointer-events:none}
.cropbox{position:absolute;border:2px solid #ffd60a;box-shadow:0 0 0 9999px rgba(0,0,0,.55);pointer-events:none}
.tl{position:relative}
.tl input[type=range]{width:100%;accent-color:var(--accent)}
.ticks{position:relative;height:12px;margin:-2px 8px 0}
.tick{position:absolute;top:0;width:3px;height:12px;border-radius:2px;background:var(--accent);transform:translateX(-50%)}
.tick.click{background:var(--hi)}
.tick.trim{background:#ffd60a;height:12px}
.rec-big{font:800 4rem/1 var(--sans);text-align:center;padding:30px}
.prev{width:100%;max-height:48vh;background:#000;border-radius:10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;background:var(--panel2);border:1px solid var(--accent);padding:.6rem 1rem;border-radius:12px;box-shadow:var(--shadow);max-width:90vw}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}

@media (max-width:980px){
  .layout,body.no-finder .layout{grid-template-columns:minmax(0,1fr)}
  aside:not(#finder){position:fixed;left:0;top:0;bottom:0;z-index:60;width:min(86vw,340px);max-height:none;background:var(--panel);transform:translateX(-102%);transition:transform .2s;padding-top:70px}
  body.nav-open aside:not(#finder){transform:none;box-shadow:var(--shadow)}
  .icon{display:block}
  .step.has-media,.step.has-media.stack{grid-template-columns:minmax(0,1fr)}
  .mwrap{width:100%}
  .res{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr}
  .brand span{display:none}
}
@media (max-width:640px){.search kbd{display:none}.top{gap:8px;padding:8px 10px}.brand{display:none}.search{margin-left:0;min-width:0}.tools .btn{padding:.4rem .6rem}#authBtn{font-size:.85rem}.quick{padding:8px 10px}main{padding-top:14px}.chhead h1{font-size:1.4rem}}
@media (prefers-reduced-motion:reduce){.mk.box,.mk.ring{animation:none}.step.flash{animation:none}}
</style>
</head>
<body>
<div id="hdr"><header class="top" id="top">
  <button class="icon" id="menuBtn" aria-label="Chapters">☰</button>
  <div class="brand"><b id="title"></b><span id="subtitle"></span></div>
  <div class="search">
    <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Search… tilt, outgas, probe, EHT" autocomplete="off" spellcheck="false">
    <kbd>/</kbd>
  </div>
  <div class="tools">
    <button class="btn" id="finderBtn" title="Where is that control?">⌖ Find it</button>
    <button class="btn" id="authBtn" title="Record clips and edit the guide">✎ Author</button>
    <button class="btn" id="themeBtn" title="Light / dark">◐</button>
  </div>
</header>
<nav class="quick" id="quick" aria-label="Quick links"></nav>
<div class="authbar" id="authbar"></div></div>
<div class="layout">
  <aside id="side"></aside>
  <main id="main"></main>
  <aside id="finder" aria-label="Find it"></aside>
</div>
<div id="modalRoot"></div>

<script src="content.js"></script>
<script>
(function(){
'use strict';

/* ---------- tiny helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
function el(tag,props,...kids){
  const n=document.createElement(tag);
  if(props) for(const k in props){
    const v=props[k];
    if(v==null||v===false) continue;
    if(k==='class') n.className=v;
    else if(k==='text') n.textContent=v;
    else if(k==='html') n.innerHTML=v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2),v);
    else if(k==='style') n.style.cssText=v;
    else n.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat()) if(c!=null&&c!==false) n.append(c.nodeType?c:document.createTextNode(c));
  return n;
}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<kbd>$1</kbd>').replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g,'$1<i>$2</i>').replace(/\n/g,'<br>');
}
const plain=s=>String(s||'').replace(/[*`]/g,'');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uid=()=>Math.random().toString(36).slice(2,8);
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let toastT=null;
function toast(msg,ms=3200){
  document.querySelectorAll('.toast').forEach(n=>n.remove());
  const t=el('div',{class:'toast',role:'status',text:msg}); document.body.append(t);
  clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),ms);
}

/* ---------- state ---------- */
let C=window.TRAINING_CONTENT||{title:'Crossbeam Quick Guide',groups:[],chapters:[],quick:[]};
const S={ch:null,query:'',author:false,dir:null,dirStale:null,dirty:false,pending:{},blobUrls:{},done:lsGet('xb.done',{}),index:[],saveT:null};
const resolve=src=>S.blobUrls[src]||src;
const findCh=id=>C.chapters.find(c=>c.id===id);
const isRef=ch=>ch.ref||ch.group==='Find it';
function normalize(){
  C.groups=C.groups||[]; C.quick=C.quick||[];
  C.chapters.forEach(ch=>{
    if(ch.group&&!C.groups.includes(ch.group)) C.groups.push(ch.group);
    ch.steps=ch.steps||[];
    ch.steps.forEach(st=>{ if(!st.id) st.id='s-'+uid(); if(st.media&&!Array.isArray(st.media)) st.media=[st.media]; });
  });
}
normalize();

/* ---------- media view (image / video with highlight overlay) ---------- */
const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>{
  es.forEach(e=>{const v=e.target; if(!v._mv) return;
    if(e.isIntersecting){ if(!v._userPaused) v.play().catch(()=>{}); } else v.pause();
  });
},{threshold:.25}):null;

function fixDuration(v){
  v.addEventListener('loadedmetadata',()=>{
    if(v.duration===Infinity||isNaN(v.duration)){
      const back=()=>{v.removeEventListener('timeupdate',back);v.currentTime=0;};
      v.addEventListener('timeupdate',back);
      v.currentTime=1e101;
    }
  });
}
function cursorAt(track,t){
  if(!track||!track.length) return null;
  const f=track[0],l=track[track.length-1];
  if(t<f.t-.35||t>l.t+.9) return null;
  if(t<=f.t) return {x:f.x,y:f.y,o:clamp((t-(f.t-.35))/.35,0,1)};
  if(t>=l.t) return {x:l.x,y:l.y,o:clamp(1-(t-l.t)/.9,0,1)};
  let i=0; while(i<track.length-2&&track[i+1].t<t) i++;
  const p=track[i],q=track[i+1]; const dt=q.t-p.t||1e-6; let u=(t-p.t)/dt;
  if(dt>.4) u=u*u*(3-2*u);
  return {x:p.x+(q.x-p.x)*u,y:p.y+(q.y-p.y)*u,o:1};
}
const ARROW_SVG='<svg viewBox="0 0 24 24"><path d="M3 2v18l5-5 3.5 7.5 3-1.4L11 14.5H18z" fill="#fff" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/></svg>';

function rectOf(base,k){
  if(!k||k.z<=1.001) return base;
  const w=base.w/k.z,h=base.h/k.z;
  return {x:clamp(k.cx-w/2,0,1-w),y:clamp(k.cy-h/2,0,1-h),w,h};
}
function camRect(m,base,t){
  const cam=m.camera; if(!cam||!cam.length) return base;
  const GL=.7; let prev=base;
  for(const k of cam){
    const tgt=rectOf(base,k), s=k.t-GL;
    if(t<=s) return prev;
    if(t<k.t){ let u=(t-s)/GL; u=u*u*(3-2*u); return {x:prev.x+(tgt.x-prev.x)*u,y:prev.y+(tgt.y-prev.y)*u,w:prev.w+(tgt.w-prev.w)*u,h:prev.h+(tgt.h-prev.h)*u}; }
    prev=tgt;
  }
  return prev;
}
function mediaView(m,o){
  o=o||{};
  const base=(o.full||!m.crop)?{x:0,y:0,w:1,h:1}:m.crop;
  const W=m.w||1920,H=m.h||1080;
  const useCam=!o.full&&m.type==='video'&&m.camera&&m.camera.length>0;
  let cur=base,camOff=false;
  const wrap=el('div',{class:'mv'+(o.editing?' editing':'')});
  wrap.style.aspectRatio=(base.w*W)+' / '+(base.h*H);
  const stage=el('div',{class:'mv-stage'});
  function layoutStage(){ stage.style.cssText=`width:${100/cur.w}%;height:${100/cur.h}%;left:${-cur.x/cur.w*100}%;top:${-cur.y/cur.h*100}%`; }
  layoutStage();
  let v=null,slaves=[];
  if(m.type==='video'){
    const list=(m.parts&&m.parts.length)?m.parts:[{src:m.src,x:0,y:0,w:W,h:H,single:true}];
    list.forEach((pt,i)=>{
      const vv=document.createElement('video'); vv.muted=true; vv.playsInline=true; vv.preload='auto'; vv.src=resolve(pt.src); fixDuration(vv);
      if(pt.single) vv.className='mv-media'; else { vv.className='mv-part'; vv.style.cssText=`left:${pt.x/W*100}%;top:${pt.y/H*100}%;width:${pt.w/W*100}%;height:${pt.h/H*100}%`; }
      vv.addEventListener('error',()=>{wrap.classList.add('broken');wrap.dataset.err='Clip not found: '+pt.src});
      stage.append(vv); if(i===0){ v=vv; v._mv=true; } else slaves.push(vv);
    });
  } else {
    const node=new Image(); node.src=resolve(m.src); node.draggable=false; node.alt=m.alt||''; node.className='mv-media';
    node.addEventListener('error',()=>{wrap.classList.add('broken');wrap.dataset.err='Image not found: '+m.src});
    stage.append(node);
  }
  wrap.append(stage);
  const ov=el('div',{class:'mv-ov'}); wrap.append(ov);
  const px=x=>((x-cur.x)/cur.w*100)+'%', py=y=>((y-cur.y)/cur.h*100)+'%';
  let markEls=[],ripEls=[],halo=null,arrow=null;
  const style=m.pointer||'halo';
  function place(){
    markEls.forEach(([mk,n])=>{ n.style.left=px(mk.x); n.style.top=py(mk.y); if(mk.k!=='ring'){ n.style.width=(mk.w/cur.w*100)+'%'; n.style.height=(mk.h/cur.h*100)+'%'; } });
    ripEls.forEach(([k,r])=>{ r.style.left=px(k.x); r.style.top=py(k.y); });
  }
  function rebuild(){
    ov.querySelectorAll('.mk,.ripple').forEach(n=>n.remove()); markEls=[];ripEls=[];
    (m.marks||[]).forEach(mk=>{
      const n=el('div',{class:'mk '+(mk.k==='ring'?'ring':'box')});
      if(mk.label){ n.append(el('span',{class:'mk-l',text:mk.label})); if((mk.y-base.y)/base.h<.16) n.classList.add('lbl-below'); if(mk.k!=='ring'&&(mk.x-base.x)/base.w>.62) n.classList.add('lbl-right'); if(mk.pos==='in'){ n.classList.remove('lbl-below','lbl-right'); n.classList.add('lbl-in'); } }
      ov.append(n); markEls.push([mk,n]);
    });
    (m.cursor||[]).forEach(k=>{ if(!k.c) return; const r=el('div',{class:'ripple'}); ov.append(r); ripEls.push([k,r]); });
    place();
  }
  rebuild();
  if(v){
    if(style==='arrow'){ arrow=el('div',{class:'arrow',html:ARROW_SVG}); ov.append(arrow); }
    halo=el('div',{class:'halo'}); ov.append(halo);
  }
  /* controls */
  let prog=null,holdT=null;
  if(!o.editing){
    const bar=el('div',{class:'mv-bar'});
    if(v){
      const bp=el('button',{text:'⏸',title:'Play / pause',onclick:e=>{e.stopPropagation(); if(v.paused){v._userPaused=false;v.play().catch(()=>{});} else {v._userPaused=true;v.pause();}}});
      const br=el('button',{text:'↺',title:'Restart',onclick:e=>{e.stopPropagation();v.currentTime=(m.trim&&m.trim.start)||0;v._userPaused=false;v.play().catch(()=>{});}});
      const bs=el('button',{text:'1×',title:'Speed',onclick:e=>{e.stopPropagation();v.playbackRate=v.playbackRate===1?.5:1;bs.textContent=v.playbackRate===1?'1×':'0.5×';}});
      v.addEventListener('play',()=>bp.textContent='⏸'); v.addEventListener('pause',()=>bp.textContent='▶');
      bar.append(bp,br,bs);
      if(useCam){ const bz=el('button',{text:'🔍 on',title:'Camera zoom on / off',onclick:e=>{e.stopPropagation();camOff=!camOff;bz.textContent=camOff?'🔍 off':'🔍 on';}}); bar.append(bz); }
    }
    bar.append(el('span',{class:'sp'}));
    if(!o.lightbox) bar.append(el('button',{text:'⤢',title:'Enlarge',onclick:e=>{e.stopPropagation();openLightbox(m);}}));
    wrap.append(bar);
    if(v){prog=el('div',{class:'mv-prog'}); wrap.append(prog);}
    wrap.addEventListener('click',()=>{ if(!o.lightbox) openLightbox(m); });
  }
  /* animation loop */
  let raf=0,seen=false;
  function tick(){
    if(!wrap.isConnected){ if(seen) return; } else seen=true;
    if(v){
      const t=v.currentTime||0;
      const start=(m.trim&&m.trim.start)||0;
      const end=(m.trim&&m.trim.end)||(isFinite(v.duration)?v.duration:(m.dur||0));
      if(!o.editing){
        if(!v.paused&&end&&t>=end-.02&&!holdT){ v.pause(); holdT=setTimeout(()=>{holdT=null;v.currentTime=start;if(!v._userPaused)v.play().catch(()=>{});},900); }
        else if(t<start-.05&&!v.seeking&&!holdT) v.currentTime=start;
        if(prog&&end>start) prog.style.width=clamp((t-start)/(end-start),0,1)*100+'%';
      }
      for(const s of slaves){
        if(Math.abs(s.currentTime-t)>.2&&!s.seeking) s.currentTime=t;
        if(s.playbackRate!==v.playbackRate) s.playbackRate=v.playbackRate;
        if(v.paused&&!s.paused) s.pause(); else if(!v.paused&&s.paused) s.play().catch(()=>{});
      }
      if(useCam){
        const r=camOff?base:camRect(m,base,t);
        if(r.x!==cur.x||r.y!==cur.y||r.w!==cur.w||r.h!==cur.h){ cur=r; layoutStage(); place(); }
      }
      const c=cursorAt(m.cursor,t);
      const tgt=style==='arrow'?arrow:halo;
      if(c){ tgt.style.left=px(c.x); tgt.style.top=py(c.y); tgt.style.opacity=c.o; if(arrow&&style==='arrow') tgt.style.transform='translate(-12%,-8%)'; if(style==='arrow') halo.style.opacity=0; }
      else { tgt.style.opacity=0; if(style==='arrow') halo.style.opacity=0; }
      if(style==='arrow'&&c){ halo.style.left=px(c.x); halo.style.top=py(c.y); halo.style.opacity=c.o*.9; }
      for(const [k,r] of ripEls){
        const a=t-k.t;
        if(a>=0&&a<.8){ const p=a/.8; r.style.opacity=(1-p)*.95; r.style.transform=`translate(-50%,-50%) scale(${.6+p*1.5})`; }
        else r.style.opacity=0;
      }
      for(const [mk,n] of markEls){
        if(mk.t0==null) continue;
        n.style.display=(t>=mk.t0&&t<=(mk.t1==null?1e9:mk.t1))?'':'none';
      }
    }
    raf=requestAnimationFrame(tick);
  }
  raf=requestAnimationFrame(tick);
  if(v&&!o.editing&&io){ io.observe(v); v.addEventListener('loadedmetadata',()=>{ if(m.trim&&m.trim.start) v.currentTime=m.trim.start; }); v.addEventListener('ended',()=>{ if(!holdT) holdT=setTimeout(()=>{holdT=null;v.currentTime=(m.trim&&m.trim.start)||0;if(!v._userPaused)v.play().catch(()=>{});},900); }); }
  return {el:wrap,video:v,rebuild,crop:base,destroy(){cancelAnimationFrame(raf);if(v){v.pause();if(io)io.unobserve(v);} slaves.forEach(s=>s.pause());}};
}


/* ---------- lightbox ---------- */
function openLightbox(m){
  let full=false,view=null;
  const root=el('div',{class:'lb',onclick:e=>{if(e.target===root||e.target===holder)close();}});
  const holder=el('div',{class:'lb-holder'});
  const toggle=el('button',{class:'btn sm',text:'Show whole screen',onclick:()=>{full=!full;toggle.textContent=full?'Zoom to area':'Show whole screen';draw();}});
  const top=el('div',{class:'lb-top'},m.crop?toggle:null,el('button',{class:'btn sm',text:'✕ Close  (Esc)',onclick:()=>close()}));
  root.append(top,holder);
  function draw(){
    if(view) view.destroy(); holder.innerHTML='';
    view=mediaView(m,{full,lightbox:true});
    const c=view.crop,ar=(c.w*(m.w||1920))/(c.h*(m.h||1080));
    view.el.style.width=Math.floor(Math.min(innerWidth*.96,(innerHeight-90)*ar))+'px';
    holder.append(view.el);
    if(view.video){ view.video.play().catch(()=>{}); }
  }
  function close(){ if(view) view.destroy(); root.remove(); window.removeEventListener('keydown',key,true); window.removeEventListener('resize',draw); }
  function key(e){ if(e.key==='Escape'){ e.stopPropagation(); close(); } }
  window.addEventListener('keydown',key,true); window.addEventListener('resize',draw);
  document.body.append(root); draw();
}

/* ---------- modal helper ---------- */
function modal(title,body,buttons,opts){
  opts=opts||{};
  const bg=el('div',{class:'modal-bg'});
  const dlg=el('div',{class:'modal'+(opts.wide?' wide':''),tabindex:'-1',role:'dialog','aria-label':title});
  const x=el('button',{class:'btn sm',text:'✕',onclick:()=>api.close()});
  dlg.append(el('div',{class:'mh'},el('h2',{text:title}),x),el('div',{class:'mb'},body));
  if(buttons&&buttons.length) dlg.append(el('div',{class:'mf'},buttons));
  bg.append(dlg);
  const api={el:dlg,close(){ if(api.onclose&&api.onclose()===false) return; bg.remove(); window.removeEventListener('keydown',key,true); },bg};
  function key(e){ if(e.key==='Escape'&&bg.isConnected&&!document.querySelector('.lb')){ const top=[...document.querySelectorAll('.modal-bg')].pop(); if(top===bg){e.stopPropagation();api.close();} } }
  window.addEventListener('keydown',key,true);
  $('#modalRoot').append(bg); dlg.focus();
  return api;
}

/* ---------- navigation / rendering ---------- */
function go(chId,stepId,noHash,main){
  const tc=findCh(chId);
  if(tc&&isRef(tc)&&!main){
    if(S.query){ S.query=''; $('#q').value=''; render(); }
    openFinder(stepId||(tc.steps[0]&&tc.steps[0].id)); return;
  }
  S.ch=chId; S.query=''; $('#q').value='';
  if(!noHash) history.replaceState(null,'','#'+chId+(stepId?'/'+stepId:''));
  document.body.classList.remove('nav-open');
  render();
  if(stepId){
    const n=document.getElementById('st-'+stepId);
    if(n){ n.scrollIntoView({block:'start'}); n.classList.add('flash'); setTimeout(()=>n.classList.remove('flash'),1800); }
  } else window.scrollTo(0,0);
}
function renderQuick(){
  const q=$('#quick'); q.innerHTML='';
  const g=C.groups.find(x=>C.chapters.some(c=>c.group===x&&!isRef(c)));
  C.chapters.filter(c=>c.group===g&&!isRef(c)).forEach(c=>
    q.append(el('button',{class:S.ch===c.id&&!S.query?'cur':'',text:c.title,onclick:()=>go(c.id,null,false,true)})));
  q.style.display=q.children.length?'':'none';
}
function renderSide(){
  const s=$('#side'); s.innerHTML='';
  C.groups.forEach(g=>{
    const chs=C.chapters.filter(c=>c.group===g); if(!chs.length&&!S.author) return;
    if(chs.length&&chs.every(isRef)&&!S.author) return;
    s.append(el('div',{class:'grp',text:chs.length&&chs.every(isRef)?g+' — edit':g}));
    chs.forEach(c=>{
      const done=!isRef(c)&&c.steps.length?c.steps.filter(st=>S.done[st.id]).length:0;
      s.append(el('button',{class:'nav'+(S.ch===c.id&&!S.query?' cur':''),onclick:()=>go(c.id,null,false,true)},
        el('span',{class:'t',text:c.title}),
        c.status==='draft'?el('span',{class:'dot',title:'Draft — verify'}):null,
        el('span',{class:'n',text:isRef(c)?String(c.steps.length):(done?done+'/':'')+c.steps.length})));
    });
  });
  if(S.author) s.append(el('div',{style:'margin-top:16px'},el('button',{class:'btn sm',text:'+ New chapter',onclick:()=>editChapter(null)})));
}
function render(){
  renderSide(); renderQuick();
  const main=$('#main'); main.innerHTML='';
  if(S.query) return renderSearch(main);
  const ch=findCh(S.ch)||C.chapters.find(c=>!isRef(c))||C.chapters[0];
  if(!ch){ main.append(el('div',{class:'empty',text:'No content yet.'})); return; }
  S.ch=ch.id;
  const head=el('div',{class:'chhead'});
  head.append(el('h1',{text:ch.title}));
  if(ch.summary) head.append(el('p',{text:ch.summary}));
  const row=el('div',{class:'row'});
  if(ch.status==='draft') row.append(el('span',{class:'badge',text:'Draft — verify with the instrument'}));
  if(!isRef(ch)&&ch.steps.length){
    const d=ch.steps.filter(st=>S.done[st.id]).length;
    row.append(el('span',{class:'chip',text:d+' of '+ch.steps.length+' done'}));
    if(d) row.append(el('button',{class:'btn sm',text:'Reset ticks',onclick:()=>{ch.steps.forEach(st=>delete S.done[st.id]);lsSet('xb.done',S.done);render();}}));
  }
  if(S.author){
    row.append(el('button',{class:'btn sm',text:'✎ Chapter',onclick:()=>editChapter(ch)}),
      el('button',{class:'btn sm',text:'▲',title:'Move up',onclick:()=>moveChapter(ch,-1)}),
      el('button',{class:'btn sm',text:'▼',title:'Move down',onclick:()=>moveChapter(ch,1)}),
      el('button',{class:'btn sm danger',text:'Delete chapter',onclick:()=>deleteChapter(ch)}));
  }
  head.append(row); main.append(head);
  if(ch.widget&&ch.widget.type==='depcalc') main.append(depCalc(ch.widget));
  if(ch.widget&&ch.widget.type==='undercut') main.append(underCalc(ch.widget));
  const list=el('div',{class:'steps'});
  ch.steps.forEach((st,i)=>list.append(stepCard(ch,st,i)));
  if(!ch.steps.length) list.append(el('div',{class:'empty',text:'No steps yet.'}));
  main.append(list);
  if(S.author) main.append(el('div',{style:'margin-top:14px'},el('button',{class:'btn',text:'+ Add step',onclick:()=>editStep(ch,null)})));
  const vis=C.chapters.filter(c=>!isRef(c)||isRef(ch)); const idx=vis.indexOf(ch),prev=vis[idx-1],next=vis[idx+1];
  main.append(el('div',{class:'pager'},
    prev?el('button',{class:'btn',text:'← '+prev.title,onclick:()=>go(prev.id,null,false,true)}):el('span'),
    next?el('button',{class:'btn',text:next.title+' →',onclick:()=>go(next.id,null,false,true)}):el('span')));
}
/* ---------- deposition current calculator ---------- */
function fmtI(pa){ return pa>=1000?(+(pa/1000).toPrecision(3))+' nA':(+pa.toPrecision(3))+' pA'; }
function parseI(tok){ const m=String(tok).trim().toLowerCase().match(/^([\d.]+)\s*(pa|na|ua|µa)?$/); if(!m) return NaN; const v=parseFloat(m[1]); const u=m[2]||'pa'; return u==='pa'?v:u==='na'?v*1e3:v*1e6; }
function depCalc(cfg){
  const defPresets=(cfg.presets||[10,20,50,100,300,700,1500,3000,7000]).slice();
  const sv=lsGet('xb.dc',{})||{};
  const st={shape:sv.shape||'rect',w:sv.w||10,h:sv.h||10,mode:sv.mode||'dens',lim:sv.lim||cfg.maxDensity||10,cap:sv.cap||1000,presets:sv.presets||defPresets.map(fmtI).join(', ')};
  const out=el('div'),box=el('div',{class:'dc'});
  const num=(k,step)=>el('input',{class:'inp',type:'number',min:'0',step:step||'any',value:String(st[k]),oninput:function(){ st[k]=+this.value; calc(); }});
  const shp=el('select',{class:'inp',onchange:function(){ st.shape=this.value; calc(); }},el('option',{value:'rect',text:'Rectangle'}),el('option',{value:'circle',text:'Circle'})); shp.value=st.shape;
  const wIn=num('w'),hIn=num('h'); const wl=el('span',{text:'Width (µm)'}),hl=el('span',{text:'Height (µm)'});
  const hLab=el('label',null,hl,hIn);
  const md=el('select',{class:'inp',style:'width:auto',onchange:function(){ st.mode=this.value; limLab(); calc(); }},el('option',{value:'dens',text:'Max density (pA/µm²)'}),el('option',{value:'cur',text:'Max total current (nA)'})); md.value=st.mode;
  const limIn=el('input',{class:'inp',type:'number',min:'0',step:'any',oninput:function(){ if(st.mode==='dens') st.lim=+this.value; else st.cap=+this.value*1000; calc(); }});
  function limLab(){ limIn.value=st.mode==='dens'?st.lim:st.cap/1000; }
